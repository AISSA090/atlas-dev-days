<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inscrivez-vous dès maintenant aux Atlas Dev Days pour réserver votre place aux conférences et ateliers.">
    <title>Atlas Dev Days - Inscription</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="maquette-figma">
        <img src="images/background.webp" alt="background" class="bg-image">
        
        <header>
            <nav>
                <img src="images/logo.png" alt="Logo Atlas Dev Days" class="logo">
                <div class="regroupement">
                    <a href="index.html">Accueil</a>
                    <a href="programme.html">Programme</a>
                    <a href="intervenants.html">Intervenants</a>
                    <a href="inscription.html" class="actif">Inscription</a>
                </div>
            </nav>
        </header>

        <main>
            <div class="formulaire">
                <h1>Inscription</h1>
                <form action="#" method="POST" onsubmit="alert('Votre inscription a bien été enregistrée.'); this.reset(); return false;">
                    
                    <div class="input">
                       <label for="fullname">Nom et Prenom :</label>
                       <input type="text" id="fullname" name="nom" required minlength="3">
                    </div>
                     <div class="input">
                       <label for="email">Email :</label>
                       <input type="email" id="email" name="email" required>
                    </div>
                     <div class="input">
                       <label for="Telephone">Numero de Telephone :</label>
                       <input type="tel" id="Telephone" name="Telephone" required pattern="^(\+212|0)[5-7][0-9]{8}$">
                    </div>

                    <div class="input">
                        <label for="profil">Profil :</label>
                        <select id="profil" name="profil" required>
                            <option value="">Sélectionnez votre profil:</option>
                            <option value="etudiant">Étudiant(e)</option>
                            <option value="dev">Développeur(e)</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>

                    <fieldset>
                        <legend>Ateliers souhaités (cochez vos choix) :</legend>
                        <input type="checkbox" id="atelier1" name="atelier1"> <label for="atelier1">Front-End</label><br>
                        <input type="checkbox" id="atelier2" name="atelier2"> <label for="atelier2">Back-End</label><br>
                        <input type="checkbox" id="atelier3" name="atelier3"> <label for="atelier3">Tech / Déploiement</label>
                    </fieldset>

                    <fieldset>
                        <legend>Journée(s) de participation :</legend>
                        <input type="radio" id="jour1" name="journee" value="jour1" required> <label for="jour1">Jour 1</label>
                        <input type="radio" id="jour2" name="journee" value="jour2" required> <label for="jour2">Jour 2</label>
                        <input type="radio" id="lesdeux" name="journee" value="lesdeux" required> <label for="lesdeux">Les deux</label>
                    </fieldset>

                    <div class="input">
                        <label for="message">Message (optionnel) :</label>
                        <textarea id="message" name="message" rows="4"></textarea>
                    </div>

                    <div class="checkbox">
                       <input type="checkbox" id="checkbox" name="check" required>
                       <label for="checkbox">J'accepte le règlement</label>
                    </div>
                    
                    <button type="submit" class="submit-button">Submit</button>
                </form>

                <div class="infos-pratiques">
                    <h2>Informations Pratiques</h2>
                    <p>Adresse : Centre Culturel, Nador</p>
                    <p>Horaires : 09h00 - 18h30</p>
                </div>
            </div>
        </main>
       
        <footer>
            <p>© 2026 Atlas Dev Days Nador. Tous droits réservés.</p>
        </footer>
    </div> 
</body>
</html>
